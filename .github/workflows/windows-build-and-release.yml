name: Windows Build & Release

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify zero-copyright & clean default config hygiene
        shell: pwsh
        run: |
          @'
          import json, re, subprocess, sys
          from pathlib import Path
          bad_ext = {'.iso','.gcm','.ciso','.gcz','.rvz','.wia','.wbfs','.wux','.dol','.rel','.elf','.gci','.bnr','.sav'}
          bad_name = re.compile(r'(main\.dol|apploader\.img|opening\.bnr|ipl.*\.bin|dsp_.*\.bin|.*bios.*)', re.I)
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          errs = []
          for rel in tracked:
              p = Path(rel)
              if p.suffix.lower() in bad_ext or bad_name.search(p.name):
                  errs.append(f'Forbidden tracked asset: {rel}')
              if rel.startswith('config/') and p.suffix.lower() == '.json':
                  raw = p.read_text(encoding='utf-8')
                  cfg = json.loads(raw)
                  if cfg.get('iso_path', '') != '':
                      errs.append(f'{rel}: iso_path must be empty')
                  if re.search(r'[A-Za-z]:[/\\]', raw):
                      errs.append(f'{rel}: hardcoded drive path found')
          if errs:
              print('\n'.join(errs), file=sys.stderr)
              sys.exit(1)
          print(f'Hygiene OK ({len(tracked)} tracked files checked)')
          '@ | python -

      - name: Configure CMake (Visual Studio 17 2022 x64)
        shell: pwsh
        run: |
          cmake --version
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DPN03_BUILD_ALL_RECOMP_UNITS=ON

      - name: Build PN03_WinPort & pn03_cpp_tests (Release)
        shell: pwsh
        run: cmake --build build --config Release --target PN03_WinPort pn03_cpp_tests --parallel

      - name: Run Python non-ISO verification suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest `
            tests.test_pn03_suite.TestPN03StaticRecompAndRuntime.test_01_manifests_symbols_vtables_and_bnr `
            tests.test_pn03_suite.TestPN03StaticRecompAndRuntime.test_02_lifted_and_hl_decompiled_sources_exist `
            tests.test_pn03_suite.TestPN03StaticRecompAndRuntime.test_03_localization_dictionary `
            tests.test_pn03_suite.TestPN03StaticRecompAndRuntime.test_05_debug_mcp_server_stdio `
            tests.test_pn03_suite.TestPN03StaticRecompAndRuntime.test_06_hle_entry_point_audit_zero_non_entry `
            tests.test_pn03_suite.TestPN03StaticRecompAndRuntime.test_07_localization_dict_and_glyph_sanitization -v
          if ($LASTEXITCODE -ne 0) {
            throw "Python non-ISO suite exited with code $LASTEXITCODE"
          }

      - name: Run built Cyber Launcher BMP smoke check & record hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build\Release\PN03_WinPort.exe --dump-launcher build\launcher_preview.bmp
          if ($LASTEXITCODE -ne 0) {
            throw "PN03_WinPort --dump-launcher exited with code $LASTEXITCODE"
          }
          if (-not (Test-Path build\launcher_preview.bmp) -or (Get-Item build\launcher_preview.bmp).Length -lt 100000) {
            throw "Launcher BMP smoke check failed"
          }
          Get-FileHash -Algorithm SHA256 build\Release\PN03_WinPort.exe, build\Release\pn03_cpp_tests.exe

      - name: Package portable Windows x64 archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "ci-" + $env:GITHUB_SHA.Substring(0, 7) }
          $stage = Join-Path $PWD "dist_stage"
          New-Item -ItemType Directory -Force -Path $stage, "$stage\config", "$stage\assets\locales", "$stage\assets\ui", "dist" | Out-Null
          Copy-Item build\Release\PN03_WinPort.exe "$stage\PN03_WinPort.exe"
          Copy-Item build\Release\pn03_cpp_tests.exe "$stage\pn03_cpp_tests.exe"
          Copy-Item config\pn03_settings.json "$stage\config\pn03_settings.json"
          Copy-Item assets\locales\zh_CN.json "$stage\assets\locales\zh_CN.json"
          Copy-Item assets\locales\zh_CN_template.json "$stage\assets\locales\zh_CN_template.json"
          Copy-Item assets\locales\zh_CN_translation_sheet.csv "$stage\assets\locales\zh_CN_translation_sheet.csv"
          Copy-Item assets\ui\* "$stage\assets\ui\" -Force
          Copy-Item README.md "$stage\README.md"
          Copy-Item README.zh-CN.md "$stage\README.zh-CN.md"
          $zipName = "PN03_WinPort_${tag}_win64.zip"
          $zipPath = Join-Path $PWD "dist\$zipName"
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force
          "ZIP_PATH=dist/$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 14

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
          generate_release_notes: true
          fail_on_unmatched_files: true
